name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Dependency & RLS Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run npm audit (high severity blocker)
        id: audit
        run: |
          set +e
          bun pm audit --audit-level=high > audit.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat audit.txt
        continue-on-error: true

      - name: Run RLS security tests
        id: rls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_JWT: ${{ secrets.ADMIN_JWT }}
          USER_JWT: ${{ secrets.USER_JWT }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: |
          set +e
          bunx vitest run src/test/*.security.test.ts > rls.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat rls.txt
        continue-on-error: true

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = fs.existsSync('audit.txt') ? fs.readFileSync('audit.txt', 'utf8') : 'audit not run';
            const rls = fs.existsSync('rls.txt') ? fs.readFileSync('rls.txt', 'utf8') : 'rls tests not run';
            const auditCode = '${{ steps.audit.outputs.exit_code }}';
            const rlsCode = '${{ steps.rls.outputs.exit_code }}';
            const body = [
              '## 🔐 Security Scan Results',
              '',
              `**Dependency audit:** ${auditCode === '0' ? '✅ pass' : '❌ high-severity findings'}`,
              `**RLS tests:** ${rlsCode === '0' ? '✅ pass' : '❌ failures'}`,
              '',
              '<details><summary>npm audit output</summary>',
              '',
              '```',
              audit.slice(0, 60000),
              '```',
              '</details>',
              '',
              '<details><summary>RLS test output</summary>',
              '',
              '```',
              rls.slice(0, 60000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail build on high-severity findings
        if: steps.audit.outputs.exit_code != '0' || steps.rls.outputs.exit_code != '0'
        run: |
          echo "::error::Security scan failed. See PR comment for details."
          exit 1
